    <script>
      /* Apply saved theme before first paint to avoid a flash of the wrong theme */
      (function () {
        try {
          var t =
            localStorage.getItem("smartmgts-theme") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();

      // apply saved language before first paint to avoid a flash of the wrong language
      (function () {
        try {
          var lang = localStorage.getItem("smartmgts-lang") || "en";
          document.documentElement.setAttribute("lang", lang);
        } catch (e) {}
      })();
    </script>
